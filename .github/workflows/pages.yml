# Staging: ghép _site từ ui/ (trình tạo), samples/ (video mẫu) và templates/briefs/ (brief xuất),
# rồi đưa lên GitHub Pages mỗi lần push nhánh main.
name: staging-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/samples _site/briefs
          cp -r ui/. _site/
          cp -r samples/. _site/samples/
          cp templates/briefs/*.json _site/briefs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
